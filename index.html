<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="一个从简单开始的纯 HTML 项目，无框架、无依赖。">
    <title>从简单开始 · 纯 HTML 项目</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7fb;
        color: #172033;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }
      .welcome {
        width: 100%;
        max-width: 720px;
        padding: clamp(24px, 6vw, 64px);
        border: 1px solid #e0e6ef;
        border-radius: 24px;
        background: #fff;
      }
      .eyebrow { margin: 0; color: #2454c6; font-size: 14px; letter-spacing: .12em; }
      h1 { margin: 16px 0; font-size: clamp(32px, 6vw, 52px); line-height: 1.2; }
      .description { color: #586579; }
      .steps { margin-top: 32px; padding: 24px; border-radius: 12px; background: #f5f7fb; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      pre { margin: 0; overflow-x: auto; }
      code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .note { margin: 24px 0 0; color: #586579; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="welcome">
      <p class="eyebrow">HTML + CSS · 零依赖</p>
      <h1>从简单开始。</h1>
      <p class="description">一个轻巧的静态网页起点。用原生 HTML 和 CSS，把你的下一个想法变成页面。</p>
      <section class="steps" aria-labelledby="start-title">
        <h2 id="start-title">开始使用</h2>
        <pre><code>npm install
npm run build</code></pre>
      </section>
      <p class="note">修改 index.html 即可开始。构建后的页面位于 dist/index.html，可直接在浏览器中打开。</p>
    </main>
  </body>
</html>
